<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PromptNova - AI Tools</title>
<meta name="description" content="PromptNova AI Tools">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#0b1020;color:#fff}
header{position:sticky;top:0;background:#11182d;padding:16px 5%;display:flex;justify-content:space-between;align-items:center}
nav a{color:#fff;text-decoration:none;margin:0 10px}
.hero{padding:80px 5%;text-align:center;background:linear-gradient(135deg,#172554,#0ea5e9)}
.hero h1{font-size:48px}
.hero p{max-width:700px;margin:20px auto}
input,textarea,button{width:100%;padding:14px;border-radius:10px;border:none;margin-top:12px}
button{background:#0ea5e9;color:#fff;cursor:pointer}
.container{max-width:1100px;margin:auto;padding:30px 5%}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.card{background:#18233f;padding:20px;border-radius:16px}
footer{text-align:center;padding:30px;color:#aaa}
@media(max-width:768px){.hero h1{font-size:34px}header{flex-direction:column;gap:10px}}
</style>
</head>
<body>
<header>
<h2>PromptNova</h2>
<nav>
<a href="#">Home</a>
<a href="#">Tools</a>
<a href="#">Blog</a>
<a href="#">About</a>
</nav>
</header>

<section class="hero">
<h1>Create Better Content with AI</h1>
<p>Generate YouTube titles, descriptions, tags and more using AI.</p>
</section>

<div class="container">
<h2>YouTube Title Generator</h2>
<div class="card">
<input id="prompt" placeholder="Enter your topic">
<button onclick="generate()">Generate</button>
<textarea id="result" rows="10" placeholder="Result will appear here"></textarea>
</div>

<h2 style="margin:40px 0 20px">Popular Tools</h2>
<div class="grid">
<div class="card"><h3>Title Generator</h3></div>
<div class="card"><h3>Description Generator</h3></div>
<div class="card"><h3>Tags Generator</h3></div>
<div class="card"><h3>Blog Writer</h3></div>
</div>
</div>

<footer>© 2026 PromptNova</footer>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbwiNBU6vZlzw46nrnP92ntYgH_JNPbJtbxWM7yWW1aYH0N9lp_yxOMcbusvSf-uX116nA/exec";

async function generate(){
 const prompt=document.getElementById("prompt").value.trim();
 if(!prompt){alert("Enter a topic");return;}
 document.getElementById("result").value="Generating...";
 try{
   const res=await fetch(API_URL,{
     method:"POST",
     headers:{"Content-Type":"application/json"},
     body:JSON.stringify({tool:"youtube_title",prompt})
   });
   const data=await res.json();
   document.getElementById("result").value=data.result||data.message||JSON.stringify(data);
 }catch(e){
   document.getElementById("result").value="Error: "+e.message;
 }
}
</script>
</body>
</html>
